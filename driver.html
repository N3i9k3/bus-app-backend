let lastLat = null;
let lastLng = null;

navigator.geolocation.watchPosition((position) => {

  const lat = position.coords.latitude;
  const lng = position.coords.longitude;

  if (lastLat && lastLng) {

    const distance =
      Math.sqrt((lat - lastLat) ** 2 + (lng - lastLng) ** 2);

    if (distance < 0.0001) {
      return; // ignore small GPS noise
    }
  }

  lastLat = lat;
  lastLng = lng;

  socket.emit("locationUpdate", { lat, lng });

});
